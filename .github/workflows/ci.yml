name: CI

# 軽量CI: 単一ジョブで単体テストとオフライン手動ビルド (build-apk.sh) を実行し、APKを検証する。
# main への push / PR で実行し、ドキュメントだけの変更では実行しない。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin compiler 1.9.23
        run: |
          curl -fsSL -o /tmp/kotlin-compiler-1.9.23.zip "https://github.com/JetBrains/kotlin/releases/download/v1.9.23/kotlin-compiler-1.9.23.zip"
          echo "93137d3aab9afa9b27cb06a824c2324195c6b6f6179d8a8653f440f5bd58be88  /tmp/kotlin-compiler-1.9.23.zip" | sha256sum -c -
          unzip -q /tmp/kotlin-compiler-1.9.23.zip -d /tmp
          echo "KOTLIN_HOME=/tmp/kotlinc" >> "$GITHUB_ENV"
      - name: Run unit tests (pure logic, no network)
        run: |
          chmod +x tests/run-tests.sh build-apk.sh
          ./tests/run-tests.sh
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Build APK (offline manual pipeline)
        run: |
          ANDROID_SDK_ROOT="$ANDROID_HOME" ./build-apk.sh
      - name: Verify APK
        run: |
          set -o pipefail
          BADGING="$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging dist/yoru-clock.apk)"
          echo "$BADGING" | head -5
          echo "$BADGING" | grep -q "versionCode='4'"
          echo "$BADGING" | grep -q "versionName='1.1.1'"
          for p in RECEIVE_BOOT_COMPLETED VIBRATE POST_NOTIFICATIONS USE_FULL_SCREEN_INTENT; do
            echo "$BADGING" | grep -q "android.permission.$p"
          done
          unzip -l dist/yoru-clock.apk | grep -q "classes.dex"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify dist/yoru-clock.apk
